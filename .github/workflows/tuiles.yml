name: Tuiles météo

# Vérifie chaque heure, pour chaque modèle, si un cycle plus récent que celui
# publié est complet (ECMWF : 00 et 12 UTC ; ICON-EU : toutes les 6 h ;
# AROME : toutes les 3 h).
# Sinon le travail s'arrête en moins d'une minute.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      model:
        description: "Modèle (vide = tous)"
        required: false
        default: ""
      run:
        description: "Cycle à produire (AAAAMMJJHH), vide = dernier complet"
        required: false
        default: ""
      force:
        description: "Republier même si ce cycle est déjà en ligne"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  tuiles:
    strategy:
      fail-fast: false
      matrix:
        model: [ecmwf, icon, arome]
    # Un modèle à la fois par modèle ; les modèles avancent en parallèle.
    concurrency:
      group: tuiles-${{ matrix.model }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      INPUT_RUN: ${{ inputs.run }}
      INPUT_FORCE: ${{ inputs.force }}
      MODEL: ${{ matrix.model }}
      INPUT_MODEL: ${{ inputs.model }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Dépendances
        run: pip install -r requirements.txt

      - name: Tests du format
        run: python -m unittest discover tests

      - name: Cycle à produire
        id: cycle
        run: |
          # Le contexte matrix n'existe pas au niveau « if » du travail : filtre ici.
          if [ -n "$INPUT_MODEL" ] && [ "$INPUT_MODEL" != "$MODEL" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Sans les secrets R2 : la tâche horaire ne fait rien ; un lancement
          # à la main produit les tuiles (essai) sans les publier.
          if [ -z "$R2_BUCKET" ] && [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then
            echo "::notice::Secrets R2 absents : rien à faire."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          run="${INPUT_RUN:-$(python -m ttwx latest-run --model "$MODEL")}"
          if ! [[ "$run" =~ ^[0-9]{8}([01][0-9]|2[0-3])$ ]]; then
            echo "Cycle invalide : $run" >&2
            exit 1
          fi
          published=""
          if [ -n "$R2_BUCKET" ]; then
            published="$(python -m ttwx remote-latest --model "$MODEL")"
          fi
          echo "Cycle complet : $run — publié : ${published:-aucun}"
          if [ "$run" = "$published" ] && [ "$INPUT_FORCE" != "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$published" ] && [ "$run" \< "$published" ] && [ "$INPUT_FORCE" != "true" ]; then
            echo "Cycle plus ancien que celui en ligne : rien à faire."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - name: Production des tuiles
        if: steps.cycle.outputs.skip != 'true'
        run: python -m ttwx produce --model "$MODEL" --run "${{ steps.cycle.outputs.run }}" --out build

      - name: Publication sur R2
        if: steps.cycle.outputs.skip != 'true'
        run: |
          if [ -z "$R2_BUCKET" ]; then
            echo "::notice::Secrets R2 absents : tuiles produites, non publiées."
            du -sh "build/$MODEL/${{ steps.cycle.outputs.run }}"
            ls "build/$MODEL/${{ steps.cycle.outputs.run }}" | wc -l
            exit 0
          fi
          python -m ttwx publish "build/$MODEL/${{ steps.cycle.outputs.run }}"
